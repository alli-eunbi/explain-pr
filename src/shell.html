<!doctype html>
<html lang="ko">

<body>
  <header class="topbar">
    <div class="brand"><svg aria-hidden="true" viewBox="0 0 28 32" fill="none"><path d="M6 6v20M6 17h9a7 7 0 0 0 7-7V8" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="5" r="3" fill="white" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="27" r="3" fill="white" stroke="currentColor" stroke-width="2"/><circle cx="22" cy="6" r="3" fill="white" stroke="currentColor" stroke-width="2"/></svg>explain-pr</div>
    <div class="pr-heading"><h1 id="prTitle"></h1><span id="repo"></span></div>
    <div class="header-actions"><span id="sampleBadge" class="pill amber hide" data-i18n="ui.sample">샘플 리포트</span><button id="download"><svg aria-hidden="true" viewBox="0 0 20 24" fill="none"><path d="M4 1h8l5 5v16H3V2Z" stroke="currentColor" stroke-width="1.4"/><path d="M12 1v6h5M6 12h8M6 16h6" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="ui.download">Markdown 저장</span></button></div>
  </header>
  <div class="workspace">
    <nav class="sidebar" aria-label="서비스 흐름" data-i18n-aria="ui.flows">
      <h2 data-i18n="ui.flows">서비스 흐름</h2><div id="flows" class="flow-list"></div>
      <div id="coverage" class="coverage"></div>
      <div class="sidebar-bottom"><button id="openReview" data-i18n="ui.openReview">검토 기록 살펴보기 ↗</button><p class="sidebar-note" data-i18n="ui.sidebarNote">요청 하나의 여정을 따라가며 조건과 상태 변화를 확인하세요.</p></div>
      <div class="revision"><span data-i18n="ui.pinned">분석 기준 · 고정된 커밋</span><span id="baseSha"></span><span id="headSha"></span><a id="prLink" target="_blank" rel="noopener noreferrer" data-i18n="ui.viewPr">GitHub에서 PR 보기 ↗</a></div>
    </nav>
    <main class="main">
      <div class="scene-heading"><div><h2 id="flowTitle"></h2><p id="summary"></p></div><div class="mode-switch" aria-label="흐름 보기 방식" data-i18n-aria="ui.modeSwitch"><button id="overviewMode" class="active" aria-pressed="true" data-i18n="ui.overview">☷ 로직 흐름도</button><button id="followMode" aria-pressed="false" data-i18n="ui.follow">◇ 3D 따라가기</button></div></div>
      <section class="stage" aria-label="서비스 로직 지도" data-i18n-aria="ui.stage">
        <div id="sceneScroll"></div>
        <div class="legend"><span><i class="changed"></i><span data-i18n="ui.legendChanged">변경</span></span><span><i></i><span data-i18n="ui.legendExisting">기존</span></span><span><i class="question"></i><span data-i18n="ui.legendQuestion">확인할 사항</span></span><span><i class="unknown"></i><span data-i18n="ui.legendUnknown">변경 미확인</span></span></div>
        <div class="canvas-tools" aria-label="지도 크기" data-i18n-aria="ui.zoom"><button id="zoomOut" aria-label="지도 축소" data-i18n-aria="ui.zoomOut">−</button><button id="zoomIn" aria-label="지도 확대" data-i18n-aria="ui.zoomIn">＋</button><button id="fit" data-i18n="ui.fit">맞춤</button></div>
        <div id="unreadScene" class="hide"><span class="unread-symbol" aria-hidden="true">⌁</span><h3 data-i18n="ui.unreadTitle">아직 살펴보지 않은 흐름</h3><p data-i18n="ui.unreadDesc">작성된 단계가 없습니다. 검토 기록에서 확인하지 못한 이유를 볼 수 있어요.</p></div>
        <div class="navigation-dock">
          <div class="state-strip"><span class="state-caption" data-i18n="ui.stateCaption">요청이 가진 값 · 예시</span><div id="stateItems" class="state-items" aria-live="polite"></div></div>
          <div class="journey-controls"><button id="previous" data-i18n="ui.previous">← 이전</button><div class="journey-current"><span id="journeyTitle"></span><span id="journeyMeta" aria-live="polite"></span></div><button id="next" class="primary">다음 단계로 점프 →</button></div>
          <div id="choices" class="choices" aria-label="다음 경로 선택" data-i18n-aria="ui.chooseRoute"></div>
          <div class="keyboard-guide"><span id="selectedRoute" aria-live="polite"></span><span id="keyGuide" title="지도 빈 곳을 클릭한 뒤 방향 키 한 번으로 이동하세요">지도 클릭 · ↑ W 정면 · ← → A D 바로 이동 · ↓ S 이전</span></div>
        </div>
      </section>
    </main>
    <aside id="detailPanel" class="detail-panel" aria-label="선택한 단계의 설명과 근거" data-i18n-aria="ui.detailAria"><div id="detail"></div><p id="evidenceNote" class="evidence-note"></p></aside>
  </div>
  <dialog id="reviewDialog" aria-labelledby="reviewTitle">
    <div class="dialog-header"><div><h2 id="reviewTitle" data-i18n="ui.review">검토 기록</h2><p><span id="reviewFlow"></span> · <span id="flowStatus"></span></p></div><button id="closeReview" aria-label="검토 기록 닫기" data-i18n-aria="ui.closeReview">×</button></div>
    <div class="review-nav" role="tablist" aria-label="검토 항목" data-i18n-aria="ui.reviewTabs"><button id="scenarioTab" class="active" role="tab" aria-selected="true" aria-controls="scenarios" data-i18n="ui.tabScenarios">조건별 동작</button><button id="findingTab" role="tab" aria-selected="false" aria-controls="findings" data-i18n="ui.tabFindings">문제 · 확인할 사항</button><button id="limitTab" role="tab" aria-selected="false" aria-controls="limitations" data-i18n="ui.tabLimits">확인 범위</button></div>
    <div class="review-body"><div id="scenarios" role="tabpanel" aria-labelledby="scenarioTab"></div><div id="findings" class="hide" role="tabpanel" aria-labelledby="findingTab"></div><div id="limitations" class="hide" role="tabpanel" aria-labelledby="limitTab"><h3 id="limitsTitle"></h3><ul id="limitsList"></ul><p id="reportSummary"></p></div><p id="testStatus"></p></div>
  </dialog>
  <script>window.__EXPLAIN_PR_REPORT__ = __EXPLAIN_PR_DATA__; window.explainPrMarkdown = __EXPLAIN_PR_MARKDOWN__;</script>
  <script>__EXPLAIN_PR_BUNDLE__</script>
</body>
</html>
