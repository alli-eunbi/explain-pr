name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tests must pass before releasing
        run: node --test tests/*.test.mjs
      - name: Tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"; tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "::error::tag v$tag does not match package.json version $pkg"; exit 1; }
      - name: Committed viewer templates must match the source
        run: npm run build && git diff --stat --exit-code assets/
      - name: Build the skill archive (runtime files only, deterministic order and timestamps)
        run: |
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg/explain-pr
          cp -R SKILL.md README.md LICENSE references scripts assets examples agents /tmp/pkg/explain-pr/
          mkdir -p /tmp/pkg/explain-pr/.claude-plugin && cp .claude-plugin/plugin.json /tmp/pkg/explain-pr/.claude-plugin/   # the archive also works with: claude --plugin-dir explain-pr.zip
          rm -f /tmp/pkg/explain-pr/scripts/build-viewer.mjs
          find /tmp/pkg -exec touch -t 200001010000 {} +
          (cd /tmp/pkg && find explain-pr -type f | LC_ALL=C sort | zip -X -q -@ "$RUNNER_TEMP/explain-pr.zip")
          unzip -l "$RUNNER_TEMP/explain-pr.zip" | tail -1
      - name: Validate the archive the way a user receives it (no npm)
        run: |
          rm -rf /tmp/unpacked && mkdir /tmp/unpacked && unzip -q "$RUNNER_TEMP/explain-pr.zip" -d /tmp/unpacked
          node /tmp/unpacked/explain-pr/scripts/validate-skill.mjs /tmp/unpacked/explain-pr
          node /tmp/unpacked/explain-pr/scripts/explain-pr.mjs demo /tmp/unpacked/demo.html --3d --lang en
      - name: Create the GitHub Release with the archive attached
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/explain-pr.zip
          generate_release_notes: true
